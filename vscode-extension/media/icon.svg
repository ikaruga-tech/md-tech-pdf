<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Paper -->
    <filter id="paperShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Drop Shadow for PDF Badge -->
    <filter id="badgeShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Base: Red Squircle -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow/Border -->
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />

  <!-- Document Sheet (White Paper with Folded Corner) -->
  <g filter="url(#paperShadow)">
    <!-- Main Paper Body -->
    <path d="M 58 36 H 158 L 198 76 V 212 A 10 10 0 0 1 188 222 H 58 A 10 10 0 0 1 48 212 V 46 A 10 10 0 0 1 58 36 Z" fill="#FFFFFF" />

    <!-- Folded Corner Flap -->
    <path d="M 158 36 V 68 A 8 8 0 0 0 166 76 H 198 Z" fill="#FFEBEE" />
    <path d="M 158 36 L 198 76" stroke="#EF9A9A" stroke-width="1.5" />
  </g>

  <!-- Markdown Symbol (Top Header Area) -->
  <g transform="translate(68, 60)">
    <!-- Markdown "M" and Down Arrow -->
    <rect x="0" y="0" width="76" height="42" rx="5" fill="none" stroke="#D32F2F" stroke-width="3" />
    <!-- M letter -->
    <path d="M 12 32 V 12 L 24 23 L 36 12 V 32" fill="none" stroke="#D32F2F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Down Arrow -->
    <path d="M 56 12 V 28 M 49 22 L 56 29 L 63 22" fill="none" stroke="#D32F2F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Diagram Flow Graph (Middle Area) -->
  <g transform="translate(68, 116)">
    <!-- Connection Lines / Edges -->
    <path d="M 52 16 L 24 50" stroke="#EF5350" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 64 16 L 96 50" stroke="#EF5350" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 36 56 H 84" stroke="#CFD8DC" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Top Node (Primary / Diamond or Pill) -->
    <rect x="42" y="2" width="34" height="20" rx="4" fill="#FFEBEE" stroke="#D32F2F" stroke-width="2.5" />
    <circle cx="59" cy="12" r="3" fill="#D32F2F" />

    <!-- Bottom Left Node -->
    <circle cx="22" cy="56" r="11" fill="#FFFFFF" stroke="#37474F" stroke-width="2.5" />
    <circle cx="22" cy="56" r="4" fill="#78909C" />

    <!-- Bottom Right Node -->
    <circle cx="98" cy="56" r="11" fill="#FFFFFF" stroke="#37474F" stroke-width="2.5" />
    <circle cx="98" cy="56" r="4" fill="#78909C" />
  </g>

  <!-- PDF Badge (Bottom Right Accent) -->
  <g filter="url(#badgeShadow)">
    <rect x="130" y="184" width="76" height="30" rx="6" fill="#D32F2F" />
    <text x="168" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PDF</text>
  </g>
</svg>
