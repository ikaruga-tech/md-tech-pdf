name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-test:
    name: Core Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Check code formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Run Core tests
        run: pnpm test

      - name: Build Core library and CLI
        run: pnpm build

  extension-test:
    name: Extension Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Core dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          npm pack

      - name: Setup Linux display server (Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2 libgbm1

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Typecheck extension and tests
        working-directory: vscode-extension
        run: npm run typecheck

      - name: Run extension unit tests (Linux with Xvfb)
        if: runner.os == 'Linux'
        working-directory: vscode-extension
        run: xvfb-run -a npm run test:unit

      - name: Run extension unit tests (macOS)
        if: runner.os != 'Linux'
        working-directory: vscode-extension
        run: npm run test:unit

  package:
    name: Build Packages & Upload Artifacts
    needs: [core-test, extension-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Build Core package
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          npm pack

      - name: Build VS Code extension package (VSIX)
        working-directory: vscode-extension
        run: |
          npm ci
          npm run build
          npx @vscode/vsce package --no-dependencies

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            md-tech-pdf-*.tgz
            vscode-extension/*.vsix
          retention-days: 14
